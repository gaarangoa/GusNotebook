<!-- Project setup reuses the workspace's ordinary small dialogs. -->
<div class="modal-back" id="project-create-back" onclick="if(event.target===this) ProjectWorkspace.closeCreate()">
  <form class="modal" id="project-create">
    <div class="mhead"><span class="grow">Linked report and notebook</span><button class="help-close" type="button" onclick="ProjectWorkspace.closeCreate()" aria-label="Close project setup">×</button></div>
    <div class="mbody">
      <p>Create a report and Jupyter notebook in the workspace. Use the usual Agent button in this project's folder; the agent receives its data, notebook and environment instructions automatically.</p>
      <div class="field"><label for="project-existing">Open an existing project</label><select id="project-existing"><option value="">New project</option></select></div>
      <div id="project-create-fields">
        <div class="field"><label for="project-name">Project name</label><input id="project-name" type="text" pattern="[a-z][a-z0-9_]{0,63}" placeholder="cohort_analysis" required></div>
        <div class="field"><label for="project-location">Parent folder</label><input id="project-location" type="text" required placeholder="/path/to/projects"></div>
      </div>
      <p id="project-create-error" role="alert"></p>
    </div>
    <div class="mfoot"><button type="button" class="btn" onclick="ProjectWorkspace.closeCreate()">Cancel</button><button type="submit" class="btn" id="project-create-submit">Create project</button></div>
  </form>
</div>
